name: XNO Runner Core

on:
  push:
    branches:
      - main
      - m1-runner-prototype
  pull_request:

jobs:
  runner-core:
    name: Runner core / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build and test runner core
        shell: bash
        run: |
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -I. \
            runner/core/runner_game.cpp runner/tests/runner_smoke.cpp \
            -o runner_smoke
          ./runner_smoke
