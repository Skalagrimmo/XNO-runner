name: XNO Runner Core

on:
  push:
    branches:
      - main
      - m1-runner-prototype
  pull_request:

jobs:
  runner-core:
    name: Runner core / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build and test with GCC or Clang
        if: runner.os != 'Windows'
        shell: bash
        run: |
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -I. \
            runner/core/runner_game.cpp runner/tests/runner_smoke.cpp \
            -o runner_smoke
          ./runner_smoke

      - name: Build and test with MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cl /nologo /std:c++20 /EHsc /W4 /WX /I. runner\core\runner_game.cpp runner\tests\runner_smoke.cpp /Fe:runner_smoke.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\runner_smoke.exe

  desktop-build:
    name: Full desktop renderer / Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and pinned engine
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build desktop runner and tests
        run: cmake --build build --parallel 2

      - name: Run native tests
        run: ctest --test-dir build --output-on-failure
