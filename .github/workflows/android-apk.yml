name: XNO Runner Android APK

on:
  push:
    branches:
      - m1-runner-prototype
    paths:
      - "android/**"
      - "runner/**"
      - "CMakeLists.txt"
      - "upstream/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-apk:
    name: Android / arm64-v8a debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository and pinned engine
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install pinned Android components
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "ndk;28.2.13676358" \
            "cmake;3.31.5"

      - name: Verify Android toolchain
        shell: bash
        run: |
          java -version
          sdkmanager --list_installed
          test -d "$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          test -d "$ANDROID_SDK_ROOT/cmake/3.31.5"

      - name: Assemble arm64-v8a debug APK
        shell: bash
        working-directory: upstream/permission-denied-native/android
        run: |
          java -classpath gradle/wrapper/gradle-wrapper.jar \
            org.gradle.wrapper.GradleWrapperMain \
            -p ../../../android \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xno-runner-android-arm64-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
